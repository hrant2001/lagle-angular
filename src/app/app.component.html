<div class="game">
  <header>
    <h1>LAGLE</h1>
    <p class="tagline">
      The one-turn-lag word game. You never see feedback for the guess you
      just made — only for the one before it.
    </p>
  </header>

  <div class="board" role="grid" aria-label="Guess board">
    <div class="row" *ngFor="let row of rows">
      <div
        class="tile"
        *ngFor="let letter of row.word.split(''); let j = index"
        [ngClass]="row.feedback ? row.feedback[j] : 'pending'"
        role="gridcell"
        [attr.aria-label]="tileLabel(letter, row.feedback ? row.feedback[j] : null)"
      >
        {{ letter }}
      </div>
    </div>

    <div class="row placeholder" *ngIf="!gameOver">
      <div class="tile empty" *ngFor="let i of [0, 1, 2, 3, 4]"></div>
    </div>
  </div>

  <div class="input-area" *ngIf="!gameOver">
    <label class="visually-hidden" for="guess-input">Enter a five-letter guess</label>
    <input
      #guessInput
      id="guess-input"
      type="text"
      [ngModel]="currentInput"
      (ngModelChange)="onInputChange($event)"
      (keyup.enter)="submitGuess()"
      maxlength="5"
      placeholder="5-letter word"
      inputmode="text"
      autocomplete="off"
      aria-describedby="game-message"
      [disabled]="isSubmitting"
      autofocus
    />
    <button type="button" (click)="submitGuess()" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Checking...' : 'Guess' }}
    </button>
  </div>

  <p
    id="game-message"
    class="game-message"
    [class.errorMessage]="messageType === 'error'"
    [class.correctMessage]="messageType === 'success'"
    [attr.role]="messageType === 'error' ? 'alert' : 'status'"
    aria-live="polite"
    *ngIf="message">
    {{ message }}
  </p>

  <div class="keyboard">
    <div class="keyboard-row" *ngFor="let keyRow of keyboardRows">
      <button
        *ngFor="let key of keyRow"
        class="key"
        type="button"
        [class.wide]="key === 'ENTER' || key === 'BACK'"
        [ngClass]="keyStatus[key]"
        [disabled]="isSubmitting || gameOver"
        [attr.aria-label]="key === 'BACK' ? 'Backspace' : key === 'ENTER' ? 'Submit guess' : key"
        (click)="onKeyClick(key)">
      {{ key === 'BACK' ? '⌫' : key }}
      </button>
    </div>
  </div>

  <footer>
    <p>{{ rows.length }} / {{ maxGuesses }} guesses used</p>
  </footer>
</div>
